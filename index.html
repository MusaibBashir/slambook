<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sign My Slambook</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#330000; --deep:#660000; --rose1:#ffd1d1; --rose2:#ff8a8a;
  --cream:#f4ece2; --ink:#f6efe6; --muted:rgba(246,239,230,.58);
  --line:rgba(255,209,209,.22); --line2:rgba(255,209,209,.14);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden;min-height:100vh;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(130% 130% at 66% 38%,#8f1e1e 0%,#5c0606 42%,#2c0000 100%)}
#bg canvas{display:block;width:100vw!important;height:100vh!important}
.halftone{position:fixed;inset:0;z-index:1;pointer-events:none;mix-blend-mode:soft-light;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.9) .6px,transparent 1.1px),radial-gradient(rgba(0,0,0,.7) .6px,transparent 1.1px);
  background-size:4px 4px,4px 4px;background-position:0 0,2px 2px}
.vign{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 100% at 50% 45%,transparent 55%,rgba(20,0,0,.55) 100%)}
.wrap{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:26px}

.panel{width:min(660px,95vw);position:relative;background:rgba(28,2,2,.34);border:1px solid var(--line);border-radius:20px;
  box-shadow:0 30px 90px rgba(20,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(14px) saturate(130%);-webkit-backdrop-filter:blur(14px) saturate(130%);padding:44px 46px 36px}
.label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--rose2)}
.title{font-family:'Inter Tight',sans-serif;font-weight:800;line-height:.98;letter-spacing:-.02em;font-size:clamp(34px,7.4vw,60px);margin:16px 0 12px}
.title .thin{font-weight:500;color:var(--muted)}
.grad{background:linear-gradient(96deg,var(--rose1),var(--rose2) 60%,#ffb0a0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:16px;line-height:1.6;max-width:46ch}

.progress{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.bar{flex:1;height:2px;background:var(--line2);position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,var(--rose1),var(--rose2));transition:width .55s var(--ease)}
.count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.1em}

.q-icon{width:38px;height:38px;color:var(--rose2);margin-bottom:18px}
.q-icon svg{width:100%;height:100%;display:block}
.q-label{font-family:'Inter Tight',sans-serif;font-weight:700;font-size:clamp(24px,4.3vw,34px);line-height:1.1;letter-spacing:-.015em;margin-bottom:8px;perspective:600px}
.wc{display:inline-block;will-change:transform,opacity}
.q-hint{color:var(--muted);font-size:14px;margin-bottom:26px}

.field input[type=text],.field textarea,.field input[type=date]{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:17px;padding:15px 17px;border-radius:12px;outline:none;transition:border .25s,background .25s,box-shadow .25s;resize:none}
.field textarea{min-height:118px;line-height:1.55}
.field input::placeholder,.field textarea::placeholder{color:rgba(246,239,230,.34)}
.field input:focus,.field textarea:focus{border-color:var(--rose2);background:rgba(255,255,255,.07);box-shadow:0 0 0 4px rgba(255,138,138,.14)}
.opt{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose1);border:1px solid rgba(255,138,138,.4);background:rgba(255,138,138,.1);border-radius:99px;padding:3px 10px;display:inline-block;margin-bottom:14px}
.photo-drop{display:flex;flex-direction:column;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;cursor:pointer;color:var(--muted);transition:border .2s,background .2s}
.photo-drop:hover{border-color:var(--rose2);background:rgba(255,255,255,.03)}
.photo-drop .pi{width:34px;height:34px;color:var(--rose2)}.photo-drop .pi svg{width:100%;height:100%}
.photo-drop .pt{font-size:14px;line-height:1.5}
.photo-prev{position:relative;display:inline-block;max-width:100%}
.photo-prev img{max-width:100%;max-height:250px;border-radius:14px;border:1px solid var(--line);display:block}
.photo-prev .rm{position:absolute;top:9px;right:9px;background:rgba(20,0,0,.82);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 13px;font-size:12px;cursor:pointer;font-family:'Inter Tight',sans-serif;backdrop-filter:blur(6px)}
.photo-prev .rm:hover{border-color:var(--rose2);color:var(--rose1)}

.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{cursor:pointer;user-select:none;padding:10px 17px;border-radius:99px;font-size:14px;font-weight:500;background:rgba(255,255,255,.03);border:1px solid var(--line);transition:all .2s var(--ease)}
.chip:hover{background:rgba(255,255,255,.09);transform:translateY(-2px)}
.chip.on{background:linear-gradient(96deg,var(--rose1),var(--rose2));border-color:transparent;color:#3a0505;font-weight:600}

.rate{display:flex;align-items:center;gap:10px}
.rt{width:38px;height:38px;cursor:pointer;color:var(--rose2);opacity:.4;transition:transform .16s var(--ease),opacity .16s}
.rt svg{width:100%;height:100%;display:block}
.rt svg path{fill:none;stroke:currentColor;stroke-width:1.6;transition:fill .16s}
.rt:hover{transform:scale(1.16)}
.rt.on{opacity:1}
.rt.on svg path{fill:currentColor}
.rnum{margin-left:8px;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:20px;color:var(--rose1);min-width:42px}

.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:32px}
.btn{cursor:pointer;font-family:'Inter Tight',sans-serif;font-weight:600;font-size:15px;border:none;border-radius:99px;padding:14px 28px;transition:transform .2s var(--ease),box-shadow .25s,opacity .2s,background .2s;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--cream);color:#3a0505;box-shadow:0 12px 30px rgba(0,0,0,.28)}
.btn.primary:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,.4)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:rgba(255,255,255,.07)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.mini{padding:11px 20px;font-size:13px}
.center{text-align:center}.stack{display:flex;flex-direction:column;align-items:center;gap:10px}

.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:99px;background:rgba(255,138,138,.12);border:1px solid rgba(255,138,138,.4);color:var(--rose1);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.review-list{display:flex;flex-direction:column;gap:10px;max-height:44vh;overflow:auto;padding-right:6px;margin-top:8px}
.review-list::-webkit-scrollbar{width:5px}.review-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.rev{background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:11px;padding:12px 15px}
.rev b{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--rose2)}
.rev p{font-size:15px;margin-top:4px;word-break:break-word}.rev .miss{color:var(--muted);font-style:italic}
.confetti{position:fixed;inset:0;z-index:9;pointer-events:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);z-index:20;background:rgba(20,0,0,.9);border:1px solid var(--line);color:var(--ink);padding:13px 22px;border-radius:99px;font-size:14px;backdrop-filter:blur(10px);transition:transform .4s var(--ease)}
.toast.show{transform:translateX(-50%) translateY(0)}.toast.err{border-color:rgba(255,138,138,.6)}
@keyframes floatOut{to{opacity:0;transform:translateY(-18px)}}
.leave{animation:floatOut .34s var(--ease) both}
@media(max-width:520px){.panel{padding:32px 24px 28px}.nav{flex-wrap:wrap}.rt,.q-icon{width:32px;height:32px}}
</style>
</head>

const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;

/* ---- questions: about YOU + about US ---- */
const QUESTIONS=[
 {key:"name",icon:"user",label:"First things first, what's your name?",hint:"So I know whose page this is.",type:"text",placeholder:"Type your name…",required:true},
 {key:"nick",icon:"spark",label:"What do I call you?",hint:"Nickname, inside joke, whatever sticks.",type:"text",placeholder:"e.g. bro, bestie, chief…"},
 {key:"photo",icon:"camera",label:"Add a photo of you?",hint:"Completely optional. Skip it if you'd rather not.",type:"photo",optional:true},

const RATE_MAX=5;

const stage=document.getElementById("stage");
let answers={},idx=0;

function swap(html){
 const old=stage.firstElementChild;
 if(old){old.classList.add("leave");old.addEventListener("animationend",()=>old.remove(),{once:true});}
 const el=document.createElement("div");el.innerHTML=html;const node=el.firstElementChild;
 node.animate([{opacity:0,transform:'translateY(24px)'},{opacity:1,transform:'none'}],{duration:500,easing:'cubic-bezier(.22,1,.36,1)',fill:'both'});
 stage.appendChild(node);return node;
}
function revealHeading(el){
 if(!el)return;
 if(window.GSAP_REVEAL){window.GSAP_REVEAL(el);}
 else el.animate([{opacity:0,filter:'blur(9px)',transform:'translateY(10px)'},{opacity:1,filter:'blur(0)',transform:'none'}],{duration:650,easing:'cubic-bezier(.22,1,.36,1)',fill:'both'});
}

function screenWelcome(){
 const n=swap(`<div class="panel center">
   <span class="label">a slambook, but make it us</span>
   <h1 class="title">Sign <span class="grad">my page</span>.<br/><span class="thin">Tell me about us.</span></h1>
   <p class="sub" style="margin:0 auto 28px">${QUESTIONS.filter(q=>q.type!=='photo').length} questions (and an optional photo): about you, and about us. Rate me, roast me, dream with me. Two minutes, and I read every word.</p>
   <div class="stack"><button class="btn primary" id="start">Start →</button></div></div>`);
 revealHeading(n.querySelector(".title"));
 n.querySelector("#start").onclick=()=>{answers={};idx=0;screenQuestion();};
}

function screenQuestion(){
 const q=QUESTIONS[idx];const val=answers[q.key]??"";
 let control="";
 if(q.type==="text")control=`<div class="field"><input type="text" id="inp" placeholder="${q.placeholder||''}" value="${escA(val)}" autocomplete="off"/></div>`;
 else if(q.type==="date")control=`<div class="field"><input type="date" id="inp" value="${escA(val)}"/></div>`;
 else if(q.type==="textarea")control=`<div class="field"><textarea id="inp" placeholder="${q.placeholder||''}">${escH(val)}</textarea></div>`;
 else if(q.type==="choice")control=`<div class="chips" id="chips">`+q.options.map(o=>`<span class="chip ${val===o?'on':''}" data-v="${escA(o)}">${o}</span>`).join("")+`</div>`;
 else if(q.type==="rating"){let h="";for(let i=1;i<=RATE_MAX;i++)h+=`<span class="rt ${val&&i<=val?'on':''}" data-v="${i}">${ic('heart')}</span>`;control=`<div class="rate" id="rate">${h}<span class="rnum" id="rnum">${val?val+' / '+RATE_MAX:''}</span></div>`;}
 else if(q.type==="photo"){control=`<span class="opt">Optional · you can skip this</span><div class="field"><input type="file" id="photoInp" accept="image/*" style="display:none"/><div id="photoWrap">${val?photoPreviewHTML(val):photoDropHTML()}</div></div>`;}
 const pct=Math.round(idx/QUESTIONS.length*100);
 const n=swap(`<div class="panel">
   <div class="progress"><div class="bar"><i style="width:${pct}%"></i></div><span class="count">${String(idx+1).padStart(2,'0')} / ${QUESTIONS.length}</span></div>
   <div class="q-icon">${ic(q.icon)}</div>
   <div class="q-label">${escH(q.label)}</div>
   <div class="q-hint">${q.hint||''}</div>
   ${control}
   <div class="nav"><button class="btn ghost mini" id="back" ${idx===0?'style="visibility:hidden"':''}>← Back</button>
   <button class="btn primary" id="next">${idx===QUESTIONS.length-1?'Review →':'Next →'}</button></div></div>`);
 revealHeading(n.querySelector(".q-label"));
 const inp=n.querySelector("#inp");
 if(inp){inp.focus();inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&q.type!=="textarea"){e.preventDefault();go(1);}});}
 if(q.type==="choice")n.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{n.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");answers[q.key]=c.dataset.v;});
 if(q.type==="rating"){
   const hs=[...n.querySelectorAll(".rt")],num=n.querySelector("#rnum");
   const paint=v=>hs.forEach(h=>h.classList.toggle("on",+h.dataset.v<=v));
   hs.forEach(h=>{h.onmouseenter=()=>paint(+h.dataset.v);h.onmouseleave=()=>paint(answers[q.key]||0);
     h.onclick=()=>{const v=+h.dataset.v;answers[q.key]=(answers[q.key]===v?0:v);paint(answers[q.key]);num.textContent=answers[q.key]?answers[q.key]+' / '+RATE_MAX:'';};});
 }
 if(q.type==="photo"){
   const fileInp=n.querySelector("#photoInp"),wrap=n.querySelector("#photoWrap");
   const bind=()=>{const drop=wrap.querySelector("#photoDrop");if(drop)drop.onclick=()=>fileInp.click();
     const rm=wrap.querySelector("#photoRm");if(rm)rm.onclick=()=>{answers.photo="";wrap.innerHTML=photoDropHTML();bind();};};
   bind();
   fileInp.onchange=()=>{const f=fileInp.files&&fileInp.files[0];if(!f)return;
     processImage(f,src=>{answers.photo=src;wrap.innerHTML=photoPreviewHTML(src);bind();});};
 }
 function collect(){if(inp)answers[q.key]=inp.value.trim();}
 function go(dir){collect();
   if(dir>0&&q.required&&!String(answers[q.key]||"").trim()){inp&&inp.focus();shake(n.querySelector(".field")||n);return;}
   if(dir>0){idx++;idx>=QUESTIONS.length?screenReview():screenQuestion();}else{idx--;screenQuestion();}}
 n.querySelector("#next").onclick=()=>go(1);
 const b=n.querySelector("#back");if(b)b.onclick=()=>go(-1);
}

function screenReview(){
 const rows=QUESTIONS.map(q=>{let v=answers[q.key];
   if(q.type==="photo")return `<div class="rev"><b>${escH(q.label)}</b>${v?`<img src="${v}" alt="photo" style="margin-top:6px;max-width:130px;border-radius:10px;border:1px solid var(--line);display:block"/>`:'<p class="miss">(no photo added)</p>'}</div>`;
   const shown=q.type==="rating"?(v?`${v} / ${RATE_MAX}`:""):String(v||"").trim();
   return `<div class="rev"><b>${escH(q.label)}</b><p class="${shown?'':'miss'}">${shown?escH(shown):'(left blank)'}</p></div>`;}).join("");
 const n=swap(`<div class="panel">
   <span class="label">almost done</span>
   <h1 class="title" style="font-size:clamp(28px,5vw,42px);margin:12px 0 4px">Look good?</h1>
   <p class="sub" style="margin-bottom:14px">Send it to drop your page into my slambook.</p>
   <div class="review-list">${rows}</div>
   <div class="nav"><button class="btn ghost mini" id="edit">← Edit</button><button class="btn primary" id="submit">Send my page →</button></div></div>`);
 revealHeading(n.querySelector(".title"));
 n.querySelector("#edit").onclick=()=>{idx=QUESTIONS.length-1;screenQuestion();};
 n.querySelector("#submit").onclick=async(e)=>{
   const btn=e.currentTarget;btn.disabled=true;btn.textContent="Sending…";
   const payload={name:answers.name||"Anonymous",overall_rating:answers.friend_rating??null,data:{...answers}};
   try{const {error}=await sb.from("slambook_entries").insert(payload);if(error)throw error;burst();screenDone();}
   catch(err){btn.disabled=false;btn.textContent="Send my page →";toast("Couldn't send. Check your internet and try again.",true);console.error(err);}
 };
}

function screenDone(){
 const name=(answers.name||"You").split(" ")[0];
 const n=swap(`<div class="panel center">
   <div class="q-icon" style="width:46px;height:46px;margin:0 auto 14px">${ic('heart')}</div>
   <span class="badge" style="margin:0 auto 18px">Signed &amp; saved</span>
   <h1 class="title">Thank you,<br/><span class="grad">${escH(name)}</span>.</h1>
   <p class="sub" style="margin:0 auto 26px">Your page is in my slambook now. This one means a lot. Really.</p>
   <div class="stack"><button class="btn primary" id="again">Sign again for someone else +</button></div></div>`);
 revealHeading(n.querySelector(".title"));
 n.querySelector("#again").onclick=()=>{answers={};idx=0;screenWelcome();};
}

function escH(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escA(s){return escH(s);}
function photoDropHTML(){return `<div class="photo-drop" id="photoDrop"><div class="pi">${ic('camera')}</div><div class="pt">Tap to add a photo<br/><span style="opacity:.7">full quality, optional</span></div></div>`;}
function photoPreviewHTML(src){return `<div class="photo-prev"><img src="${src}" alt="your photo"/><button class="rm" id="photoRm" type="button">Remove</button></div>`;}
function processImage(file,cb){
 // store the original image exactly as-is, no resizing or compression
 const reader=new FileReader();
 reader.onload=()=>cb(reader.result);
 reader.onerror=()=>toast("Couldn't read that image, try another.",true);
 reader.readAsDataURL(file);
}
function shake(el){el.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(-5px)'},{transform:'translateX(0)'}],{duration:320,easing:'ease-in-out'});}
const toastEl=document.getElementById("toast");let toastT;
function toast(m,err){toastEl.textContent=m;toastEl.classList.toggle("err",!!err);toastEl.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove("show"),3600);}

/* confetti */
const cc=document.getElementById("confetti"),cx=cc.getContext("2d");let parts=[];
function sizeC(){cc.width=innerWidth;cc.height=innerHeight;}sizeC();addEventListener("resize",sizeC);
function burst(){const cols=["#ffd1d1","#ff8a8a","#f4ece2","#ffb0a0","#cc4b4b"];parts=[];
 for(let i=0;i<170;i++)parts.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:(Math.random()-1)*15,g:.35+Math.random()*.2,r:4+Math.random()*6,c:cols[i%cols.length],a:1,rot:Math.random()*6,vr:(Math.random()-.5)*.4});}
(function tick(){cx.clearRect(0,0,cc.width,cc.height);
 parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.a-=.008;cx.save();cx.globalAlpha=Math.max(0,p.a);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);cx.restore();});
 parts=parts.filter(p=>p.a>0&&p.y<cc.height+40);requestAnimationFrame(tick);})();

screenWelcome();
</script>

<!-- ============ ENHANCEMENTS: Paper Swirl shader + GSAP wind text (progressive) ============ -->
<script type="importmap">
{"imports":{
 "react":"https://esm.sh/react@19.0.0",
 "react/jsx-runtime":"https://esm.sh/react@19.0.0/jsx-runtime",
 "react-dom":"https://esm.sh/react-dom@19.0.0",
 "react-dom/client":"https://esm.sh/react-dom@19.0.0/client",
 "@paper-design/shaders-react":"https://esm.sh/@paper-design/shaders-react@0.0.77?external=react,react-dom",
 "gsap":"https://esm.sh/gsap@3.12.5"
}}

<script type="module">
// GSAP wind-blown heading reveal (adapted from the wind-blown-text effect)
try{
 const {default:gsap}=await import("gsap");
 const rnd=(a,b)=>a+Math.random()*(b-a);
 window.GSAP_REVEAL=(el)=>{
   const text=el.getAttribute("data-raw")||el.textContent;
   el.setAttribute("data-raw",text);el.setAttribute("aria-label",text);
   el.innerHTML=text.split("").map(c=>c===" "?'<span class="wc">&nbsp;</span>':`<span class="wc">${c.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</span>`).join("");
   const chars=el.querySelectorAll(".wc");
   gsap.set(el,{perspective:600});
   gsap.fromTo(chars,
     {opacity:0,x:()=>rnd(70,240),y:()=>rnd(-70,70),z:()=>rnd(-160,160),rotationX:()=>rnd(-260,260),rotationY:()=>rnd(-180,180),rotationZ:()=>rnd(-90,90)},
     {opacity:1,x:0,y:0,z:0,rotationX:0,rotationY:0,rotationZ:0,duration:.9,ease:"power3.out",stagger:{each:.028,from:"random"}});
 };
 const cur=document.querySelector(".title,.q-label");if(cur)window.GSAP_REVEAL(cur);
}catch(e){console.warn("gsap enhancement skipped:",e);}

// Paper Design Swirl shader background (the exact wrapped config)
try{
 const React=(await import("react")).default;
 const {createRoot}=await import("react-dom/client");
 const {Swirl}=await import("@paper-design/shaders-react");
 const root=createRoot(document.getElementById("bg"));
 root.render(React.createElement(Swirl,{
   colors:["#ffd1d1","#ff8a8a","#660000"],colorBack:"#330000",
   bandCount:4,twist:0.07,center:0.64,proportion:0.52,softness:0,
   noise:0.2,noiseFrequency:0.4,speed:0.32,
   style:{position:"absolute",inset:0,width:"100%",height:"100%"}
 }));
}catch(e){console.warn("shader enhancement skipped (using gradient fallback):",e);}
</script>
